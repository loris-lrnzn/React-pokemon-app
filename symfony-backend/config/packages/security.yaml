security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    # firewall pour le login (json_login) — garde stateless: true
    login:
      pattern: ^/user/login
      stateless: true
      json_login:
        check_path: /user/login
        username_path: email
        password_path: password
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure

    # firewall pour toutes les routes API protégées
    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      jwt: ~

    # (optionnel) firewall pour autres routes utilisateur (si besoin)
    user_area:
      pattern: ^/user
      stateless: true
      provider: app_user_provider
      jwt: ~

  access_control:
    - { path: ^/user/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/pokemons, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/user, roles: IS_AUTHENTICATED_FULLY }
